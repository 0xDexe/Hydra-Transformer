# ============================================================
# Model Config: Hierarchical Hybrid Transformer (v3)
# ============================================================

# Core model parameters
vocab_size: 50257
d_model: 512
n_layers: 8
n_heads: 8

# Local Mamba (SSM) parameters
d_state: 16
d_conv: 4
expand: 2

# Routing
use_routing: true
routing_topk_ratio: 0.20
router_hidden_dim: 512

# Hierarchical global context
chunk_size: 64              # sequence → chunk compression
global_kernel: 5            # Mamba kernel for global SSM
context_mode: "conv"        # lightweight context layer mode

dropout: 0.1
max_seq_len: 2048
