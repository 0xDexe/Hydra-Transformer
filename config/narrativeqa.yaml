# NarrativeQA - Safe Configuration (No CUDA Errors)
# This config works reliably based on your testing

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_state: 16
  d_conv: 4
  expand: 2
  dropout: 0.1
  tie_weights: true

router:
  hidden_dim: 64
  target_ratio: 0.15
  use_gradient_balancing: true
  use_position_invariance: true
  use_checkpoint: false
  use_query_aware_routing: false  # Disable for now (can enable later)

curriculum:
  warmup_steps: 0  # Disable curriculum
  
router_loss:
  total_weight: 0.01
  load_balance: 0.01
  entropy: 0.01
  variance: 0.01
  position_invariance: 0.005
  layer_diversity: 0.005

data:
  dataset_name: 'narrativeqa'
  tokenizer_name: 'gpt2'
  max_length: 2048
  batch_size: 4           # Reasonable batch size
  num_workers: 4
  
  use_summary: true
  max_train_samples: null  # Use full dataset
  max_val_samples: null

training:
  num_epochs: 15
  learning_rate: 0.007
  weight_decay: 0.01
  grad_clip: 1.0
  
  # Safe optimizations (tested and working)
  use_amp: true                    
  gradient_accumulation_steps: 4   
  use_fused_optimizer: true        
  compile_model: false             

logging:
  use_wandb: true
  project_name: 'hydra-narrativeqa'
  run_name: 'narrativeqa-safe-v1'
  output_dir: '/projectnb/cs523aw/students/outputs/narrativeqa'
  log_interval: 50
  monitor_interval: 200
  save_every: 1