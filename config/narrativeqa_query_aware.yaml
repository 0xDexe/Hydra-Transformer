# Complete Query-Aware HYDRA Configuration
# Works with train_query_aware_complete.py

model:
  d_model: 768
  n_layers: 12
  n_heads: 12
  d_state: 16
  d_conv: 4
  expand: 2
  d_ff: 3072
  dropout: 0.1
  tie_weights: true

router:
  hidden_dim: 64
  target_ratio: 0.15
  use_gradient_balancing: true
  use_position_invariance: true

router_loss:
  total_weight: 0.01
  load_balance: 0.01
  entropy: 0.01
  variance: 0.01
  position_invariance: 0.005
  layer_diversity: 0.005

curriculum:
  router_warmup_steps: 2000
  curriculum_heuristic: 'uniform'

data:
  dataset_name: 'naturalqa'
  tokenizer_name: 'gpt2'
  max_length: 2048
  batch_size: 4
  num_workers: 4
  max_train_samples: null
  max_val_samples: null

training:
  num_epochs: 10
  learning_rate: 0.007
  weight_decay: 0.01
  grad_clip: 1.0
  use_amp: true
  gradient_accumulation_steps: 4
  use_fused_optimizer: true

logging:
  use_wandb: true
  project_name: 'hydra-query-aware'
  run_name: 'query-aware-naturalqa-v1'
  output_dir: 'outputs/query_aware_naturalqa'
  log_interval: 50
  monitor_interval: 200
  save_every: 5